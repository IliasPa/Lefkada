name: Verify the live site against the published code

# Rebuilds the exact commit the live site says it runs and compares every file
# with what the site actually serves (scripts/verify-live.mjs). A difference
# means the deployed app is NOT the code in this repository — a changed script,
# a build made from unpublished code, a tampered hosting account — and opens a
# can't-miss issue (GitHub emails it).
#
# Setup (Settings ▸ Secrets and variables ▸ Actions ▸ Variables — none is secret):
#   · LIVE_URL — the public address of the app, e.g. https://lefkada.example
#     (until it is set, this workflow does nothing).
#   · Every NEXT_PUBLIC_* setting the HOST has beyond the Supabase URL/key must
#     be mirrored here under the same name and value, because they are compiled
#     into the files: NEXT_PUBLIC_VAPID_PUBLIC_KEY,
#     NEXT_PUBLIC_GOVGR_ENABLED, NEXT_PUBLIC_BALLOT_DELAY_MAX_S,
#     NEXT_PUBLIC_BALLOT_RELAY_URL.
#
# This workflow lives in the same repository as the code it checks, so it
# cannot be the only guard: for a real vote, have someone independent run
# `node scripts/verify-live.mjs --url …` from their own machine as well.

on:
  schedule:
    - cron: '23 */6 * * *' # four times a day
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write # the failure alarm

env:
  LIVE_URL: ${{ vars.LIVE_URL }}
  # Public by design (they ship inside the app bundle) — same values as keepalive.yml.
  NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://cdsoekdoxjuswxdgamlr.supabase.co' }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_gwnBlS3jR6JOb3-3LjR3rA__s50A1Ys' }}
  NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
  NEXT_PUBLIC_GOVGR_ENABLED: ${{ vars.NEXT_PUBLIC_GOVGR_ENABLED }}
  NEXT_PUBLIC_BALLOT_DELAY_MAX_S: ${{ vars.NEXT_PUBLIC_BALLOT_DELAY_MAX_S }}
  NEXT_PUBLIC_BALLOT_RELAY_URL: ${{ vars.NEXT_PUBLIC_BALLOT_RELAY_URL }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the live commit may be older than the tip

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION || '22' }}

      - name: Compare the live site with a fresh build of its commit
        run: |
          if [ -z "$LIVE_URL" ]; then
            echo "::notice::LIVE_URL is not set (Settings ▸ Variables) — nothing to verify yet."
            exit 0
          fi
          node scripts/verify-live.mjs --url "$LIVE_URL"

      - name: Open a can't-miss issue (GitHub emails it) on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY=$'# 🔴 Η ζωντανή εφαρμογή ΔΕΝ ταιριάζει με τον δημοσιευμένο κώδικα\n\n## Ο αυτόματος έλεγχος βρήκε διαφορά ανάμεσα σε όσα σερβίρει ο ιστότοπος και σε ό,τι χτίζεται από το commit που δηλώνει.\n\n**Τι να κάνετε:**\n\n1. Δείτε το [αποτυχημένο run]('"$RUN_URL"$') — γράφει ποια αρχεία διαφέρουν.\n2. Αν μόλις αλλάξατε κάποια ρύθμιση `NEXT_PUBLIC_*` στον πάροχο φιλοξενίας, αντιγράψτε την ίδια τιμή στις Variables αυτού του αποθετηρίου και τρέξτε ξανά τον έλεγχο.\n3. Αν ΔΕΝ υπάρχει τέτοια εξήγηση: μην ξεκινήσετε / διακόψτε κάθε ψηφοφορία, αλλάξτε τους κωδικούς του παρόχου φιλοξενίας και του GitHub, και κάντε νέα ανάπτυξη από το `main`.\n4. Όταν διορθωθεί, κλείστε αυτό το issue.\n\n*Αυτό το issue ανοίχτηκε αυτόματα από το workflow «Verify the live site against the published code».*'
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "🔴 LIVE SITE DOES NOT MATCH THE PUBLISHED CODE — $(date -u +%Y-%m-%d)" \
            --body "$BODY"
